plugins {
    id 'com.android.application'
}

def controllerRelease = providers.gradleProperty('controllerRelease').getOrElse('false').toBoolean()
def controllerBuildDir = providers.gradleProperty('controllerBuildDir').orNull
if (controllerBuildDir) {
    layout.buildDirectory.set(file(controllerBuildDir))
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName '2.6.26-tcl'
    }

    signingConfigs {
        controller {
            if (controllerRelease) {
                def keyFile = System.getenv('TVCONTROL_RELEASE_KEYSTORE')
                def password = System.getenv('TVCONTROL_RELEASE_PASSWORD')
                if (!keyFile || !password) {
                    throw new GradleException('Use scripts/build-launcher.ps1 to configure private release signing')
                }
                storeFile file(keyFile)
                storePassword password
                keyAlias 'tcl-tvhome'
                keyPassword password
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig controllerRelease ? signingConfigs.controller : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions.unitTests.includeAndroidResources = true
    testOptions.unitTests.all {
        // Robolectric 4.14 otherwise omits WindowManager's visible-app flag.
        systemProperty 'robolectric.areWindowsMarkedVisible', 'true'
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/licenseAssets')
    sourceSets.test.resources.srcDir rootProject.file('../controller/tests/fixtures')
}

def copyLicenseNotices = tasks.register('copyLicenseNotices', Copy) {
    from rootProject.file('../LICENSE')
    from rootProject.file('FONT-LICENSE-OFL.txt')
    from rootProject.file('THIRD-PARTY-NOTICES.txt')
    into layout.buildDirectory.dir('generated/licenseAssets/licenses')
}
tasks.named('preBuild').configure { dependsOn copyLicenseNotices }

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'org.slf4j:slf4j-nop:2.0.13'
    // Test only; none of these dependencies are packaged in the APK.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
