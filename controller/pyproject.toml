[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcl-tv-control"
version = "1.0.0"
description = "Local, preservation-first Android TV controller and daily app allowance"
requires-python = ">=3.12"
dependencies = [
    "adb-shell==0.4.4",
    "cryptography>=45,<51",
    "rsa>=4.9,<5",
    "pyasn1>=0.6,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "Pillow>=11.1,<13",
    "tzdata>=2025.1",
    "websockets>=15,<17",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tvcontrol*"]

[tool.setuptools.package-data]
tvcontrol = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
